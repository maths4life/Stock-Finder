name: Weekly data refresh

# Milestone: changed from a daily weekday job to a weekly job (Product/
# Engineering decision — see HANDOFF.md and DATA_STRATEGY.md §3). The
# founder's own usage is weekly research, and prices/fundamentals/
# financial statements don't need daily freshness for that; this also
# roughly halves the total yfinance request volume against the tracked
# ~498-company universe.
on:
  schedule:
    # 20:30 UTC every Friday = 02:00 IST Saturday — i.e. Saturday early
    # morning IST, safely after Friday's NSE market close (15:30 IST) and
    # after Friday's US/global market activity that Yahoo's data reflects.
    # Day-of-week is pinned to Friday only (5), so this fires exactly once
    # a week — do not widen the day-of-week field without re-checking this
    # comment.
    - cron: "30 20 * * 5"

  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # --- Dependency order matters below: prices -> technicals ->
      # fundamentals -> financial statements -> news -> scores.
      # Each step fails the job loudly (non-zero exit) if its own
      # fetch/write run was mostly or entirely unsuccessful — see
      # ingest/resilience.py's assert_healthy() and each script's own
      # per-item retry/continue behavior, unchanged from before. A step
      # failing here stops the workflow: GitHub Actions does not run
      # later steps after a failed step by default, so a broken prices
      # fetch can never silently feed stale data into technicals/scores.

      - name: Fetch prices
        working-directory: backend
        run: python -m ingest.fetch_prices

      - name: Compute technical snapshot
        working-directory: backend
        run: python -m ingest.compute_technicals

      # Also writes the shareholding-pattern approximation (delegates to
      # fetch_shareholding.py's shared logic) and company sector/industry
      # metadata enrichment — unchanged from the previous daily job, see
      # MODULE_7C_SHAREHOLDING_REPORT.md.
      - name: Fetch fundamentals
        working-directory: backend
        run: python -m ingest.fetch_fundamentals

      # Real multi-period Quarterly/Annual financial statement history
      # (Module 7) — hits yfinance's statement endpoints, not
      # Ticker.info. Genuinely quarterly-cadence data, but refreshed
      # every weekly run anyway: cheap and idempotent (upserts), and
      # keeps a single schedule rather than a second one.
      - name: Fetch financial statements
        working-directory: backend
        run: python -m ingest.fetch_financial_statements

      # Weekly Market Intelligence (news) refresh — runs on every
      # scheduled trigger (TD-008/TD-009 closed: feeds verified via
      # scripts/validate_news_pipeline.py). Runs before scores so
      # sector intelligence is fresh when scores are recomputed.
      - name: Weekly market intelligence (news) refresh
        working-directory: backend
        run: python -m ingest.weekly_news_refresh

      # Always last: scores are derived from the fundamentals, financial
      # statements, prices, and technicals refreshed above, so recomputing
      # them first would score against the previous week's data.
      - name: Compute scores
        working-directory: backend
        run: python -m ingest.compute_scores