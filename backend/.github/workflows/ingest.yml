name: Daily data refresh

on:
  schedule:
    # 18:00 UTC = 11:30 PM IST, after NSE market close (15:30 IST)
    - cron: "0 18 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices
        run: python -m ingest.fetch_prices

      - name: Compute technical snapshot
        run: python -m ingest.compute_technicals

      # Fundamentals don't actually change daily (Yahoo's own ratios move
      # roughly on the underlying company's reporting cadence), but running
      # it daily is cheap (~500 upserts as of Milestone 7's universe
      # expansion, idempotent) and simpler than a second cron schedule.
      # Revisit if API load/rate-limiting becomes a concern — see
      # DATA_STRATEGY.md §3. Also writes the shareholding-pattern
      # approximation (delegates to fetch_shareholding.py's shared logic —
      # see MODULE_7C_SHAREHOLDING_REPORT.md) and company sector/industry
      # metadata enrichment.
      - name: Fetch fundamentals
        run: python -m ingest.fetch_fundamentals

      # Real multi-period Quarterly/Annual financial statement history
      # (Module 7, Milestone 7) — a separate step from "Fetch fundamentals"
      # above because it hits yfinance's *statement* endpoints, not
      # Ticker.info, and changes cadence is genuinely quarterly (a
      # company's reported financials don't change between its own
      # earnings releases) rather than needing a daily refresh for
      # correctness — kept in the same daily job anyway for the same
      # "cheap and idempotent, simpler than a second schedule" reasoning
      # as fundamentals above.
      - name: Fetch financial statements
        run: python -m ingest.fetch_financial_statements

      - name: Compute scores
        run: python -m ingest.compute_scores
